<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This Object Is NOT Moving</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #030308;
            color: #f0f0f8;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            transition: opacity .22s ease;
        }

        body.page-leaving {
            opacity: 0;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(8,8,20,0.75);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            color: #f0f0f8;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            text-decoration: none;
            transition: border-color .2s ease, transform .15s ease;
        }

        .back-btn:hover {
            border-color: rgba(255,255,255,0.3);
            transform: translateX(-2px);
        }

        .back-btn:active {
            transform: translateX(0);
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        canvas { display: block; }

        /* ─── UI OVERLAY ─── */
        #ui {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 28px 20px 32px;
        }

        /* Top meme label */
        .meme-label {
            background: rgba(8, 8, 20, 0.65);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            padding: 14px 24px;
            text-align: center;
            max-width: 520px;
            width: 100%;
            box-shadow:
                0 8px 32px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
        }

        .meme-label::before {
            content: '';
            position: absolute;
            top: 0; left: 16px; right: 16px; height: 1px;
            background: linear-gradient(90deg,
                transparent,
                rgba(255,255,255,0.2) 50%,
                transparent
            );
        }

        .meme-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(18px, 4vw, 26px);
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .mode-a .meme-title { color: #7c9ef7; }
        .mode-b .meme-title { color: #a78bfa; }

        .meme-sub {
            font-size: clamp(11px, 2.5vw, 13px);
            color: rgba(200,200,220,0.55);
            margin-top: 5px;
            font-weight: 400;
        }

        /* Bottom controls */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 520px;
            pointer-events: auto;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .mode-btn {
            flex: 1;
            padding: 13px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(12, 12, 20, 0.7);
            color: rgba(200,200,220,0.6);
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(13px, 3vw, 16px);
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(16px);
            text-align: center;
        }

        .mode-btn.active-a {
            background: linear-gradient(135deg, rgba(124,158,247,0.2), rgba(124,158,247,0.05));
            border-color: rgba(124,158,247,0.4);
            color: #7c9ef7;
            box-shadow: 0 0 20px rgba(124,158,247,0.15);
        }

        .mode-btn.active-b {
            background: linear-gradient(135deg, rgba(167,139,250,0.2), rgba(167,139,250,0.05));
            border-color: rgba(167,139,250,0.4);
            color: #a78bfa;
            box-shadow: 0 0 20px rgba(167,139,250,0.15);
        }

        .mode-btn:hover:not(.active-a):not(.active-b) {
            border-color: rgba(255,255,255,0.18);
            color: #f0f0f8;
        }

        .hint {
            font-size: 11px;
            color: rgba(160,160,180,0.35);
            letter-spacing: 1px;
            text-align: center;
        }

        /* Floating annotation arrows */
        .annotation {
            position: fixed;
            z-index: 11;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .annotation-box {
            background: rgba(8,8,20,0.75);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: clamp(10px, 2vw, 12px);
            font-weight: 600;
            letter-spacing: 0.5px;
            backdrop-filter: blur(12px);
            white-space: nowrap;
        }

        .annotation.cube-label { color: #7c9ef7; }
        .annotation.camera-label { color: #f87171; }

        #ann-cube {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -130px);
        }

        #ann-camera {
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
        }

        /* Mode transition flash */
        #flash {
            position: fixed;
            inset: 0;
            background: rgba(124,158,247,0.08);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }
    </style>
</head>
<body>

<a href="../index.html" class="back-btn" id="backBtn" aria-label="Go back">← Back</a>

<div id="canvas-container"></div>
<div id="flash"></div>

<!-- UI -->
<div id="ui">

    <!-- Top Label -->
    <div class="meme-label mode-a" id="top-label">
        <div class="meme-title" id="label-title">THIS OBJECT IS NOT MOVING</div>
        <div class="meme-sub" id="label-sub">The camera is orbiting around it. Totally different.</div>
    </div>

    <!-- Annotations -->
    <div class="annotation cube-label" id="ann-cube">
        <div class="annotation-box" id="ann-cube-text">📦 The Cube (stationary, trust me)</div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls">
        <div class="btn-row">
            <button class="mode-btn active-a" id="btn-a" onclick="setMode('a')">
                MODE A<br><span style="font-size:10px; font-weight:400; opacity:0.7">Object still, camera moves</span>
            </button>
            <button class="mode-btn" id="btn-b" onclick="setMode('b')">
                MODE B<br><span style="font-size:10px; font-weight:400; opacity:0.7">Object moves, camera still</span>
            </button>
        </div>
        <div class="hint">SAME RESULT. DIFFERENT REALITY. 🤯</div>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/notmoving.js"></script>
</body>
</html>

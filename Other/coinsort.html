<!DOCTYPE html>
<html>

<head>
    <title>Coin Sorter 3000</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background: #111;
            user-select: none;
            transition: opacity .22s ease;
        }

        body.page-leaving {
            opacity: 0;
        }

        .back-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #00ffcc;
            color: #000;
            border: 3px solid #000;
            padding: 8px 14px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 14px;
            text-decoration: none;
            border-radius: 8px;
            transition: transform .1s, background-color .2s ease;
        }

        .back-btn:hover {
            background: #fff;
        }

        .back-btn:active {
            transform: scale(0.92);
        }

        #ui {
            position: absolute;
            top: 62px;
            left: 10px;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
            pointer-events: none;
        }

        #ui h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
            color: #00ffcc;
        }

        #ui h2 {
            margin: 5px 0;
            font-size: 24px;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0055;
            text-align: center;
            background: rgba(10, 10, 10, 0.95);
            padding: 40px;
            border: 6px solid #ff0055;
            border-radius: 15px;
            box-shadow: 0 0 30px #ff0055;
        }

        #game-over h1 {
            margin-top: 0;
            font-size: 48px;
        }

        button {
            pointer-events: auto;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            background: #fff;
            color: #000;
            border: 4px solid #000;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        button:hover {
            background: #ff0055;
            color: #fff;
            transform: scale(1.1);
        }

        #fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            background: #00ffcc;
            color: #000;
            border: 3px solid #000;
            padding: 10px 16px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            pointer-events: auto;
        }

        #fullscreen-btn:active {
            transform: scale(0.92);
        }

        #mobile-alert {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #00ffcc;
            border: 3px solid #00ffcc;
            padding: 20px 30px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-align: center;
            z-index: 200;
            opacity: 1;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        #mobile-alert.fade-out {
            opacity: 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <a href="../index.html" class="back-btn" id="backBtn" aria-label="Go back">← BACK</a>
    <div id="ui">
        <h1>COIN SORTER 3000 🤑</h1>
        <h2>SCORE: <span id="score">0</span></h2>
        <h2>TIME: <span id="time">60</span>s</h2>
    </div>
    <button id="fullscreen-btn">⛶ FULLSCREEN</button>
    <div id="mobile-alert">📱 ROTATE & GO FULLSCREEN<br>for the best experience 👀</div>
    <div id="game-over">
        <h1>TIME'S UP 🤡</h1>
        <h2>FINAL SCORE: <span id="final-score"></span></h2>
        <br>
        <button onclick="location.reload()">RESTART BRO 😭</button>
    </div>

    <script src="js/coinsort.js"></script>
</body>
</html>

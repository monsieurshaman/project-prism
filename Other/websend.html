<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Webhook Transit</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 0 16px;
      transition: opacity .22s ease;
    }

    body.page-leaving {
      opacity: 0;
    }

    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #f2f2f2;
      border: 1px solid #ccc;
      border-radius: 8px;
      color: #333;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      text-decoration: none;
      transition: background-color .2s ease;
    }

    .back-btn:hover {
      background: #e6e6e6;
    }

    input,
    textarea,
    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      margin-top: 12px;
      cursor: pointer;
    }

    #status {
      margin-top: 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <a href="../index.html" class="back-btn" id="backBtn" aria-label="Go back">← Back</a>

  <h2>Webhook Transit for Discord</h2>

  <label>Mode</label>
  <select id="modeSelect">
    <option value="basic">Basic (channel)</option>
    <option value="forumNew">Forum — New Post</option>
    <option value="forumReply">Forum — Reply to Thread</option>
  </select>

  <div id="basicFields">
    <label>Webhook URL</label>
    <input type="text" id="webhookUrl_basic" placeholder="https://discord.com/api/webhooks/...">

    <label>Username (optional)</label>
    <input type="text" id="username_basic" placeholder="Bot name">
  </div>

  <div id="forumFields" style="display:none">
    <label>Forum Webhook URL</label>
    <input type="text" id="webhookUrl_forum" placeholder="https://discord.com/api/webhooks/...">

    <label>Username (optional)</label>
    <input type="text" id="username_forum" placeholder="Bot name">

    <div id="threadNameField">
      <label>New Post Title (thread_name)</label>
      <input type="text" id="threadName" placeholder="Patch Notes v1.2">
    </div>

    <div id="threadIdField" style="display:none">
      <label>Thread ID (thread_id)</label>
      <input type="text" id="threadId" placeholder="123456789012345678">
    </div>
  </div>

  <label>Message</label>
  <textarea id="message" placeholder="Type your message..."></textarea>

  <button id="sendBtn">Send</button>
  <div id="status"></div>

  <script src="js/websend.js"></script>

</body>

</html>

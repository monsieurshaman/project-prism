<!DOCTYPE html>
<html lang="en">

<head>
    <title>prism launcher: rift runners 2d</title>
    <link rel="stylesheet" href="../project-assets/prism-launcher-rr2d.css">
    <meta property="og:type" content="website">
    <meta property="og:title" content="rift runners 2d: echo protocol">
    <meta property="og:description" content="project prism's core flagship projects">
    <meta property="og:image" content="https://proprism.pages.dev/project-assets/og-image.png">
    <meta property="og:url" content="https://proprism.pages.dev/RiftRunners2D">
    <meta property="og:site_name" content="by Project Prism respectfully">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a12">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>

<body>

    <div id="bg-canvas">
        <div class="bg-placeholder"></div>
    </div>

    <canvas id="chase-canvas"></canvas>

    <div class="bg-gif"></div>
    <video id="bg-video" autoplay loop muted playsinline style="display: none; position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.5; pointer-events: none; filter: brightness(0.75) saturate(0.6);"></video>

    <div class="bg-overlay"></div>

    <div id="loader-overlay">
        <svg class="loader-hex" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="4"
                stroke-dasharray="60 20" />
            <circle cx="50" cy="50" r="25" fill="none" style="stroke: var(--accent-2)" stroke-width="2" stroke-dasharray="20 10" />
        </svg>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="loader-status" id="loader-status">SYNCING NODES...</div>
    </div>

    <div class="page-wrapper" id="page-wrapper">

        <div class="topbar">
            <a href="https://proprism.pages.dev" class="topbar-brand">
                <img src="../project-assets/logo2.png" alt="..." class="topbar-logo">
                <span class="topbar-name">prism</span>
            </a>
            <div class="topbar-pill">rr2d</div>
        </div>

        <div class="hero-card">

            <div class="hero-header">
                <div class="hero-icon-wrap">
                    <i class="material-icons-round">track_changes</i>
                </div>
                <div class="hero-text">
                    <h1 class="hero-title">rift runners 2d</h1>
                    <div class="hero-sub">echo protocol</div>
                </div>
            </div>

            <p class="hero-desc">
                project prism's <strong>2d top-down progressive survival arcade game</strong> based on phaser.js
            </p>

            <div class="platform-badge" id="platform-badge">
                <i class="material-icons-round">radar</i>
                <span id="platform-label">system stable</span>
            </div>

            <button class="launch-btn" id="btn-launch" onclick="initiateLaunch(event)">
                <i class="material-icons-round">play_arrow</i>
                <div class="launch-content">
                    <span class="launch-title">go play</span>
                    <span class="launch-sub" id="version-text">launch the protocol</span>
                </div>
            </button>

            <a href="../index.html" class="back-btn">
                <i class="material-icons-round">arrow_back</i>
                back
            </a>

        </div>

        <div class="page-footer">
            <p>project prism by monsieurshaman on github/discord!!</p>
        </div>

    </div>

    <script src="../project-assets/prism-launcher-rr2d.js"></script>
    <script src="../project-assets/prism-themesync.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>prism launcher: sand box 3d</title>
    <link rel="stylesheet" href="../project-assets/prism-launcher-sb3d.css">
    <meta property="og:type" content="website">
    <meta property="og:title" content="sand box 3d">
    <meta property="og:description" content="project prism's core flagship projects">
    <meta property="og:image" content="https://proprism.pages.dev/project-assets/og-image.png">
    <meta property="og:url" content="https://proprism.pages.dev/SandBox3D">
    <meta property="og:site_name" content="by Project Prism respectfully">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body>

    <div id="bg-canvas">
        <div class="bg-placeholder"></div>
    </div>
    <div class="bg-overlay"></div>

    <canvas id="physics-canvas" style="position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.6;"></canvas>

    <div class="bg-gif"></div>
    <video id="bg-video" autoplay loop muted playsinline style="display: none; position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.5; pointer-events: none; filter: brightness(0.75) saturate(0.6);"></video>

    <div id="loader-overlay" style="background: #111;">
        <div class="glitch-bar"
            style="position: absolute; left: 0; right: 0; height: 4px; background: rgba(255, 0, 80, 0.7); animation: hbar-sweep 0.6s linear infinite; z-index: 4;">
        </div>
        <svg class="loader-hex" viewBox="0 0 100 100" style="animation: glitch-skew 0.4s infinite steps(1);">
            <rect x="25" y="25" width="50" height="50" fill="none" stroke="currentColor" stroke-width="4" />
            <rect x="35" y="35" width="30" height="30" fill="currentColor" opacity="0.6" />
        </svg>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="loader-status" id="loader-status" style="animation: rgb-drift 0.3s infinite; color: #fff;">MOUNTING BABYLON...</div>
    </div>

    <div class="page-wrapper" id="page-wrapper">

        <div class="topbar">
            <a href="https://proprism.pages.dev" class="topbar-brand">
                <img src="../project-assets/logo2.png" alt="..." class="topbar-logo">
                <span class="topbar-name">prism</span>
            </a>
            <div class="topbar-pill">sb3d</div>
        </div>

        <div class="hero-card">

            <div class="hero-header">
                <div class="hero-icon-wrap">
                    <i class="material-icons-round">view_in_ar</i>
                </div>
                <div class="hero-text">
                    <h1 class="hero-title">sand box 3d</h1>
                    <div class="hero-sub">prism launchpad</div>
                </div>
            </div>

            <p class="hero-desc">
                project prism's <strong>sandbox game</strong> based on babylon.js and cannon.js
            </p>

            <div class="platform-badge" id="platform-badge">
                <i class="material-icons-round">devices</i>
                <span id="platform-label">...</span>
            </div>

            <button class="launch-btn" id="btn-launch" onclick="initiateLaunch(event)">
                <i class="material-icons-round">play_circle</i>
                <div class="launch-content">
                    <span class="launch-title">go play</span>
                    <span class="launch-sub" id="version-text">initialize sandbox</span>
                </div>
            </button>

            <a href="../index.html" class="back-btn">
                <i class="material-icons-round">arrow_back</i>
                back
            </a>

        </div>

        <div class="page-footer">
            <p>project prism by monsieurshaman on github/discord!!</p>
        </div>

    </div>

    <script src="../project-assets/prism-launcher-sb3d.js"></script>
    <script src="../project-assets/prism-themesync.js"></script>
</body>
</html>
